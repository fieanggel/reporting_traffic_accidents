name: Deploy to ECS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 002332699253.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY_BACKEND: repodifiebackend
  ECR_REPOSITORY_FRONTEND: repodifiefrontend
  ECS_CLUSTER: difie-cluster
  ECS_SERVICE: difie-app-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Clean Docker cache
        run: |
          docker builder prune -af
          docker system prune -af

      - name: Build, tag, and push backend
        run: |
          docker build \
            --no-cache \
            --pull \
            --platform linux/amd64 \
            -t ${{ env.ECR_REPOSITORY_BACKEND }}:latest \
            ./backend
          
          docker tag ${{ env.ECR_REPOSITORY_BACKEND }}:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest

      - name: Build, tag, and push frontend
        run: |
          docker build \
            --no-cache \
            --pull \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            -t ${{ env.ECR_REPOSITORY_FRONTEND }}:latest \
            ./frontend
          
          docker tag ${{ env.ECR_REPOSITORY_FRONTEND }}:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

      - name: Force new deployment with fresh image pull
        run: |
          # Update service dengan force deployment
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          # Tunggu 5 detik lalu restart task (opsional, untuk memastikan image baru ditarik)
          sleep 5
          
          # Dapatkan task ARN yang sedang running
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --desired-status RUNNING \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns[0]' \
            --output text)
          
          # Stop task lama agar ECS menarik image terbaru
          if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
            aws ecs stop-task \
              --cluster ${{ env.ECS_CLUSTER }} \
              --task "$TASK_ARN" \
              --region ${{ env.AWS_REGION }} || true
            echo "Task lama dihentikan, ECS akan membuat task baru dengan image fresh"
          else
            echo "Tidak ada task running yang ditemukan"
          fi